<div class="profile-widget">
  <button
    type="button"
    class="account-btn"
    (click)="toggle($event)"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true"
    aria-label="Opções de perfil e conta"
    title="Perfil e conta">
    <svg class="account-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
  </button>

  @if (isOpen()) {
    <div class="profile-backdrop" (click)="close()" aria-hidden="true"></div>
    <div class="profile-popover" role="menu" aria-label="Menu da conta">
      <div class="popover-header">
        @if (authService.currentUser(); as user) {
          <span class="user-name">Olá, <strong>{{ user.name }}</strong></span>
          <span class="user-sub">{{ user.email }}</span>
        } @else {
          <span class="user-name">Olá, <strong>Visitante</strong></span>
          <span class="user-sub">Acesse sua conta para ver suas consultas</span>
        }
      </div>

      <div class="popover-divider" role="separator"></div>

      <div class="popover-items">
        <button
          type="button"
          class="popover-item"
          role="menuitem"
          (click)="onSelectOption('conta')">
          <svg class="popover-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Conta</span>
        </button>

        <button
          type="button"
          class="popover-item"
          role="menuitem"
          (click)="onSelectOption('agendamentos')">
          <svg class="popover-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>{{ authService.isDoctor() ? 'Agendamentos' : 'Meus agendamentos' }}</span>
        </button>
      </div>

      <div class="popover-divider" role="separator"></div>

      <div class="popover-footer">
        @if (authService.isAuthenticated()) {
          <button
            type="button"
            class="popover-item popover-item--danger"
            role="menuitem"
            (click)="onLogout()">
            <svg class="popover-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Sair da conta</span>
          </button>
        } @else {
          <button
            type="button"
            class="popover-item popover-item--cta"
            role="menuitem"
            (click)="openLogin()">
            <svg class="popover-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>Entrar ou Cadastrar</span>
          </button>
        }
      </div>
    </div>
  }
</div>
